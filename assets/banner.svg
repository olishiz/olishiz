<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Oliver Sim — AI-native senior software engineer</title>
  <desc id="desc">A futuristic animated GitHub profile banner showing Oliver Sim as a full-stack, cloud and AI engineer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.5" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#111735"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f5d3b3"/>
      <stop offset="1" stop-color="#dba57b"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#253253"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity=".08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#7dd3fc" fill-opacity=".18"/>
    </pattern>
    <pattern id="microgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#93c5fd" stroke-opacity=".06" stroke-width=".6"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="portraitClip">
      <circle cx="966" cy="216" r="126"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="24" fill="url(#microgrid)"/>

  <!-- ambient light -->
  <circle cx="1030" cy="130" r="320" fill="url(#glowPurple)"/>
  <circle cx="770" cy="350" r="300" fill="url(#glowCyan)"/>
  <ellipse cx="235" cy="80" rx="260" ry="180" fill="url(#glowCyan)" opacity=".34"/>

  <!-- animated scan line -->
  <rect x="0" y="-16" width="1200" height="22" fill="url(#accent)" opacity=".05">
    <animate attributeName="y" values="-22;442" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- technical frame -->
  <path d="M36 74V38H72 M1128 38h36v36 M36 346v36h36 M1128 382h36v-36"
        fill="none" stroke="#7dd3fc" stroke-opacity=".42" stroke-width="2"/>
  <path d="M56 55H400" stroke="url(#accent)" stroke-opacity=".65" stroke-width="2"/>
  <path d="M800 365H1144" stroke="url(#accent)" stroke-opacity=".65" stroke-width="2"/>
  <g fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" opacity=".55">
    <text x="56" y="48">PROFILE.NODE / 01</text>
    <text x="1018" y="48">KL · MY</text>
    <text x="1085" y="48">03.1390°N</text>
    <text x="56" y="388">BUILD · SHIP · LEARN · REPEAT</text>
  </g>

  <!-- identity -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="68" y="126" font-size="16" font-weight="700" letter-spacing="4.5" fill="#67e8f9">HELLO, I BUILD THE FUTURE</text>
    <text x="64" y="198" font-size="72" font-weight="900" letter-spacing="-3" fill="#f8fafc">OLIVER</text>
    <text x="349" y="198" font-size="72" font-weight="900" letter-spacing="-3" fill="url(#accent)">SIM</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
      <text x="68" y="239" fill="#cbd5e1">SENIOR SOFTWARE ENGINEER</text>
      <rect x="392" y="220" width="12" height="23" rx="2" fill="#22d3ee" filter="url(#tinyGlow)">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="68" y="277" font-size="18" fill="#94a3b8">
      Full-stack systems. Cloud platforms. AI-native products.
    </text>
    <text x="68" y="303" font-size="18" fill="#94a3b8">
      Turning complex engineering into software people can use.
    </text>
  </g>

  <!-- capability chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing=".8">
    <g transform="translate(68 326)">
      <rect width="108" height="34" rx="17" fill="#0c1d33" stroke="#22d3ee" stroke-opacity=".65"/>
      <circle cx="18" cy="17" r="4" fill="#22d3ee" filter="url(#tinyGlow)"/>
      <text x="32" y="22" fill="#cffafe">FULL STACK</text>
    </g>
    <g transform="translate(187 326)">
      <rect width="92" height="34" rx="17" fill="#101b38" stroke="#60a5fa" stroke-opacity=".65"/>
      <circle cx="18" cy="17" r="4" fill="#60a5fa" filter="url(#tinyGlow)"/>
      <text x="32" y="22" fill="#dbeafe">CLOUD</text>
    </g>
    <g transform="translate(290 326)">
      <rect width="72" height="34" rx="17" fill="#1d183d" stroke="#a78bfa" stroke-opacity=".7"/>
      <circle cx="18" cy="17" r="4" fill="#a78bfa" filter="url(#tinyGlow)"/>
      <text x="32" y="22" fill="#ede9fe">AI</text>
    </g>
    <g transform="translate(373 326)">
      <rect width="94" height="34" rx="17" fill="#131d35" stroke="#818cf8" stroke-opacity=".65"/>
      <circle cx="18" cy="17" r="4" fill="#818cf8" filter="url(#tinyGlow)"/>
      <text x="32" y="22" fill="#e0e7ff">DEVOPS</text>
    </g>
    <g transform="translate(478 326)">
      <rect width="152" height="34" rx="17" fill="#0e2230" stroke="#34d399" stroke-opacity=".62"/>
      <circle cx="18" cy="17" r="4" fill="#34d399" filter="url(#tinyGlow)">
        <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="22" fill="#d1fae5">READY TO SHIP</text>
    </g>
  </g>

  <!-- terminal card -->
  <g transform="translate(535 72)">
    <rect width="252" height="177" rx="16" fill="#060b18" fill-opacity=".82" stroke="#334155" stroke-opacity=".9"/>
    <rect x="1" y="1" width="250" height="34" rx="15" fill="#111827"/>
    <path d="M1 34H251" stroke="#334155"/>
    <circle cx="18" cy="18" r="4" fill="#fb7185"/>
    <circle cx="33" cy="18" r="4" fill="#fbbf24"/>
    <circle cx="48" cy="18" r="4" fill="#34d399"/>
    <text x="70" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">oliver@shiz — zsh</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text x="16" y="58" fill="#67e8f9">$ whoami</text>
      <text x="16" y="80" fill="#e2e8f0">senior_engineer</text>
      <text x="16" y="105" fill="#67e8f9">$ current_mission</text>
      <text x="16" y="127" fill="#e2e8f0">build useful AI systems</text>
      <text x="16" y="152" fill="#67e8f9">$ deploy --quality</text>
      <rect x="151" y="140" width="8" height="14" fill="#a7f3d0">
        <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- orbital portrait system -->
  <g>
    <circle cx="966" cy="216" r="165" fill="#080e20" fill-opacity=".58" stroke="#475569" stroke-opacity=".65"/>
    <circle cx="966" cy="216" r="148" fill="none" stroke="#22d3ee" stroke-opacity=".24" stroke-width="1.5" stroke-dasharray="3 10"/>
    <circle cx="966" cy="216" r="133" fill="#0a1228" stroke="url(#accent)" stroke-opacity=".8" stroke-width="2"/>
    <circle cx="966" cy="216" r="126" fill="#09101f"/>

    <g transform="rotate(0 966 216)">
      <circle cx="966" cy="51" r="5" fill="#22d3ee" filter="url(#tinyGlow)"/>
      <circle cx="1131" cy="216" r="4" fill="#a78bfa" filter="url(#tinyGlow)"/>
      <circle cx="966" cy="381" r="3" fill="#60a5fa" filter="url(#tinyGlow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 966 216" to="360 966 216" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- portrait contents -->
    <g clip-path="url(#portraitClip)">
      <rect x="838" y="88" width="256" height="256" fill="#081121"/>
      <path d="M838 310L1094 170V344H838Z" fill="#0f1b36"/>
      <path d="M846 323L1086 192" stroke="#22d3ee" stroke-opacity=".13" stroke-width="2"/>
      <path d="M862 340L1094 214" stroke="#a78bfa" stroke-opacity=".1" stroke-width="2"/>

      <!-- floating avatar -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 3;0 -3;0 3" dur="4.8s" repeatCount="indefinite"/>

        <!-- broad-shouldered upper body -->
        <path d="M846 365C854 298 886 272 924 264H1008C1050 274 1080 304 1088 365Z" fill="url(#shirt)"/>
        <path d="M846 365C854 298 886 272 924 264H1008C1050 274 1080 304 1088 365" fill="none" stroke="#334155" stroke-width="4"/>
        <path d="M899 281Q966 316 1033 281" fill="none" stroke="#4f5e7f" stroke-opacity=".5" stroke-width="3"/>
        <path d="M920 267L942 307L966 281L991 307L1012 267" fill="#080d19" stroke="#273554" stroke-width="2"/>

        <!-- neck -->
        <path d="M936 238V276Q966 292 996 276V238Z" fill="url(#skin)"/>

        <!-- ears -->
        <ellipse cx="900" cy="195" rx="12" ry="18" fill="#e0ae86"/>
        <ellipse cx="1032" cy="195" rx="12" ry="18" fill="#d49b72"/>

        <!-- face -->
        <path d="M904 156C910 115 939 99 968 99C1002 99 1028 121 1028 160V205C1028 248 1002 270 967 270C933 270 906 247 906 205Z" fill="url(#skin)"/>

        <!-- hair -->
        <path d="M900 172C895 120 923 84 969 84C1017 84 1042 119 1031 171C1024 149 1013 133 997 123L995 147C985 130 974 119 959 116L956 143C945 128 931 123 917 130C909 140 904 154 900 172Z" fill="#090b10"/>
        <path d="M913 133C928 112 949 105 969 109L951 147C943 134 929 129 913 133Z" fill="#11141c"/>
        <path d="M960 109C982 104 1003 113 1016 130L989 148C984 130 974 117 960 109Z" fill="#0d1017"/>
        <path d="M902 165L915 154V188L905 181Z" fill="#090b10"/>
        <path d="M1030 165L1018 154V188L1028 181Z" fill="#090b10"/>

        <!-- brows -->
        <path d="M926 178Q941 170 954 177" fill="none" stroke="#2b211d" stroke-width="5" stroke-linecap="round"/>
        <path d="M980 177Q994 170 1008 178" fill="none" stroke="#2b211d" stroke-width="5" stroke-linecap="round"/>

        <!-- eyes blink -->
        <g>
          <ellipse cx="941" cy="194" rx="6.5" ry="7.5" fill="#111827"/>
          <ellipse cx="994" cy="194" rx="6.5" ry="7.5" fill="#111827"/>
          <circle cx="943" cy="192" r="2" fill="#f8fafc"/>
          <circle cx="996" cy="192" r="2" fill="#f8fafc"/>
          <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.89;.92;.95;1" dur="5.5s" repeatCount="indefinite"/>
        </g>
        <g opacity="0">
          <path d="M934 195Q941 199 948 195" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
          <path d="M987 195Q994 199 1001 195" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.89;.92;.95;1" dur="5.5s" repeatCount="indefinite"/>
        </g>

        <!-- nose and confident smile -->
        <path d="M967 198Q972 214 965 219" fill="none" stroke="#b97855" stroke-width="3" stroke-linecap="round"/>
        <path d="M943 234Q967 251 991 233" fill="none" stroke="#75432f" stroke-width="4" stroke-linecap="round"/>
        <path d="M951 239Q967 246 983 238" fill="none" stroke="#f8fafc" stroke-opacity=".72" stroke-width="2"/>

        <!-- shirt insignia -->
        <path d="M950 320L966 303L982 320L966 337Z" fill="none" stroke="url(#accent)" stroke-width="3"/>
        <circle cx="966" cy="320" r="4" fill="#22d3ee" filter="url(#tinyGlow)"/>
      </g>
    </g>

    <!-- floating engineering glyphs -->
    <g transform="translate(805 125)">
      <rect width="88" height="50" rx="10" fill="#091427" fill-opacity=".92" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="14" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#67e8f9">&lt;code/&gt;</text>
      <path d="M14 34H69" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <path d="M14 41H52" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="805 125;805 118;805 125" dur="4s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(1070 120)">
      <rect width="72" height="58" rx="12" fill="#10112b" fill-opacity=".92" stroke="#a78bfa" stroke-opacity=".6"/>
      <!-- cloud -->
      <path d="M20 37H52C59 37 62 33 62 28C62 23 58 20 53 20C51 13 45 10 39 10C31 10 25 15 24 22C18 22 14 25 14 30C14 34 16 37 20 37Z" fill="none" stroke="#c4b5fd" stroke-width="2.5"/>
      <animateTransform attributeName="transform" type="translate" values="1070 120;1070 128;1070 120" dur="4.6s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(1083 286)">
      <rect width="75" height="48" rx="12" fill="#081b21" fill-opacity=".92" stroke="#34d399" stroke-opacity=".58"/>
      <!-- dumbbell -->
      <path d="M23 24H52" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round"/>
      <path d="M17 15V33M23 18V30M52 18V30M58 15V33" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="1083 286;1083 279;1083 286" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- footer status -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
    <circle cx="807" cy="387" r="4" fill="#34d399" filter="url(#tinyGlow)">
      <animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="819" y="391" fill="#94a3b8">AZURE ARCHITECT · KUALA LUMPUR · THE SHIZ</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".32" stroke-width="2"/>
</svg>